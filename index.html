<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gtps.Host</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }body {
  background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 36px;
  color: #60a5fa;
}

p {
  text-align: center;
  margin-bottom: 25px;
  color: #cbd5e1;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border-radius: 14px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
  font-weight: bold;
}

button:hover {
  transform: scale(1.03);
  opacity: 0.95;
}

.dashboard {
  display: none;
  padding: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.profile-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid #60a5fa;
  cursor: pointer;
  background: #1e293b;
}

.profile-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dashboard-card {
  background: rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.dashboard-card h2 {
  margin-bottom: 12px;
  color: #93c5fd;
}

.price-box {
  margin-top: 15px;
  padding: 16px;
  border-radius: 18px;
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(96,165,250,0.3);
}

.settings-menu {
  position: fixed;
  top: 80px;
  right: 20px;
  width: 300px;
  background: #111827;
  border-radius: 20px;
  padding: 20px;
  display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  z-index: 10;
}

.settings-menu h3 {
  margin-bottom: 15px;
  color: #60a5fa;
}

.settings-menu input[type="color"] {
  height: 50px;
  cursor: pointer;
  padding: 5px;
}

.server-box {
  margin-top: 15px;
  padding: 15px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}

.server-box span {
  color: #60a5fa;
  font-weight: bold;
}

.hidden {
  display: none;
}

  </style>
</head>
<body>  <div class="container" id="authPage">
    <div class="card">
      <h1>Gtps.Host</h1>
      <p>Elegant GTPS Hosting Dashboard</p><input type="text" id="username" placeholder="Username" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="login()">Register / Login</button>
</div>

  </div>  <div class="dashboard" id="dashboard">
    <div class="topbar">
      <div>
        <h1 style="font-size:30px">Gtps.Host</h1>
        <p style="text-align:left">Welcome to your dashboard</p>
      </div><div class="profile-btn" onclick="toggleSettings()">
    <img id="avatarPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="avatar">
  </div>
</div>

<div class="dashboard-card">
  <h2>Create Server</h2>
  <p style="text-align:left">Create your GTPS server instantly.</p>

  <input type="text" id="serverName" placeholder="Server Name" />
  <input type="text" id="serverOwner" placeholder="Owner Name" />

  <button onclick="createServer()">Create Server</button>

  <div class="price-box">
    <h3>Hosting Price</h3>
    <p style="text-align:left">
      Biaya server adalah <b>Rp20.000</b> untuk 1 bulan hosting.
    </p>
  </div>

  <div id="serverResult"></div>
</div>

  </div>  <div class="settings-menu" id="settingsMenu">
    <h3>Settings</h3><p style="text-align:left">Upload Avatar</p>
<input type="file" accept="image/*" onchange="changeAvatar(event)" />

<p style="text-align:left">Background Color</p>
<input type="color" onchange="changeBackground(this.value)" />

  </div>  <script>
    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if(username === '' || password === '') {
        alert('Please fill all fields');
        return;
      }

      document.getElementById('authPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
    }

    function createServer() {
      const name = document.getElementById('serverName').value;
      const owner = document.getElementById('serverOwner').value;
      const result = document.getElementById('serverResult');

      if(name === '' || owner === '') {
        alert('Please complete server information');
        return;
      }

      result.innerHTML = `
        <div class="server-box">
          <h3>Server Created</h3>
          <p><span>Server:</span> ${name}</p>
          <p><span>Owner:</span> ${owner}</p>
          <p><span>Status:</span> Waiting Payment</p>
          <p><span>Price:</span> Rp20.000 / month</p>
        </div>
      `;
    }

    function toggleSettings() {
      const menu = document.getElementById('settingsMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function changeAvatar(event) {
      const file = event.target.files[0];

      if(file) {
        const reader = new FileReader();

        reader.onload = function(e) {
          document.getElementById('avatarPreview').src = e.target.result;
        }

        reader.readAsDataURL(file);
      }
    }

    function changeBackground(color) {
      document.body.style.background = color;
    }
  </script></body>
  </html>
